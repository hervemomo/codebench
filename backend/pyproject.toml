[project]
name = "codebench-backend"
version = "0.1.0"
description = "CodeBench backend — FastAPI service and extracted notebook package"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "redis",
  "rq",
  "pandas",
  "openpyxl",
  "numpy",
  "scikit-learn",
  "umap-learn",
  "hdbscan",
  "openai",
  "python-multipart",
  "pytest",
  "pytest-asyncio",
  "httpx",
  "factory-boy",
  "ruff",
  "ftfy",
  "lingua-language-detector",
  "tenacity",
  "matplotlib",
  "seaborn",
  "pytest-cov",
  "pyarrow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
