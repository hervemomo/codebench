services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    # Real RQ worker command lands in Sequence 3; kept idle for now so `up`
    # succeeds without a task queue to consume.
    command: sh -c "echo 'worker placeholder — see Sequence 3' && sleep infinity"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cb
      POSTGRES_PASSWORD: cb
      POSTGRES_DB: cb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cb -d cb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-off bucket-bootstrap helper. Not started by `up`; invoked explicitly
  # by scripts/ci_setup.sh via `docker compose run --rm mc "<sh -c command>"`.
  mc:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      - minio
    profiles: ["tools"]

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    command: npm run dev
    ports:
      - "5173:5173"

volumes:
  pgdata:
  redisdata:
  miniodata:
